<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Builder — viewer</title>
  <link rel="stylesheet" href="/style.css">
  <!--
    three.js from a CDN via an import map, so this page needs no build step.
    To work offline, vendor the two files next to this one and point these
    entries at them; nothing else changes.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header id="hud">
    <h1 id="title">Waiting for a structure…</h1>
    <p id="subtitle"></p>
  </header>

  <section id="chat" aria-label="Chat with Claude">
    <div id="chat-header">
      <span id="link-dot" class="dot" title="Connection to the Claude session"></span>
      <span id="link-label">connecting…</span>
    </div>
    <ol id="messages"></ol>
    <form id="prompt-form" autocomplete="off">
      <input id="prompt" type="text" placeholder="Describe a build, or ask for a change…"
             aria-label="Prompt">
      <button type="submit" id="send">Send</button>
    </form>
  </section>

  <aside id="panel">
    <div class="row">
      <label><input type="checkbox" id="by-operation"> Colour by operation</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="show-grid"> Ground grid</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="annotate-mode"> Mark up the build</label>
    </div>
    <p id="annotate-help" hidden>
      Click a block to mark it. <kbd>Shift</kbd>-click two blocks to mark the box
      between them. <kbd>Esc</kbd> cancels.
    </p>
    <div id="legend"></div>
  </aside>

  <section id="notes" aria-label="Your notes on this build" hidden>
    <div id="notes-header">
      <span id="notes-count"></span>
      <button type="button" id="apply-notes">Apply notes</button>
    </div>
    <ol id="notes-list"></ol>
  </section>

  <form id="note-composer" hidden>
    <p id="note-target"></p>
    <input id="note-text" type="text" autocomplete="off"
           placeholder="What's wrong with it?" aria-label="Note">
    <div id="note-actions">
      <button type="submit" id="note-save">Add note</button>
      <button type="button" id="note-cancel">Cancel</button>
    </div>
  </form>

  <div id="status" role="status"></div>

  <noscript>This viewer needs JavaScript.</noscript>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
