[project]
name = "minecraft-builder-mcp"
version = "0.2.0"
description = "MCP server for generating Minecraft structures from natural language using Claude"
authors = [{name = "Jesper Morais"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "mcschematic>=11.0.0",
    "pydantic>=2.0.0",
    # Litematica (.litematic) export. Only a pre-release exists, hence the
    # explicit beta floor; capped because a silent writer regression in a beta
    # would produce files that load but build wrong.
    "litemapy>=0.11.0b0,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]
# render_structure only. Out of the base install because it brings a browser with
# it — ~150 MB once `playwright install chromium` has run — which is a steep
# price for anyone who only wants the schematic tools. Every other tool works
# without it, and the render tool names the install command when it is missing.
render = [
    "playwright>=1.40",
]
# Automatic scoring in the eval harness. Optional because the harness is useful
# without it — it still renders the benchmark set and writes a bundle to score by
# hand — and because judging spends money, which is not a capability a plain
# install should quietly acquire.
eval = [
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minecraft_builder = ["data/*.tsv", "data/*.json", "data/*.md"]
# Viewer frontend, served by the local HTTP server at runtime.
"minecraft_builder.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# High-signal, low-churn: pycodestyle, pyflakes, imports, warnings, bugbear.
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # long lines are mostly tool descriptions and doc tables

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Pragmatic: catch real type mistakes without demanding full annotation.
check_untyped_defs = true
warn_redundant_casts = true
