[project]
name = "minecraft-builder-mcp"
version = "0.1.0"
description = "MCP server for generating Minecraft structures from natural language using Claude"
authors = [{name = "josh"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "mcschematic>=11.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minecraft_builder = ["data/*.tsv", "data/*.json", "data/*.md"]
